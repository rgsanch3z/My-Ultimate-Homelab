---
- name: Preparar Nodo de Monitoreo
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Eliminar configuraciones conflictivas antiguas de Docker
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.gpg

    - name: Actualizar caché de apt
      apt:
        update_cache: yes

    - name: Instalar paquetes necesarios
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present

    - name: Crear directorio para llaves de Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar llave GPG de Docker (Modo Moderno)
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker-new

    - name: Instalar Docker y Plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Asegurar que el servicio Docker esté corriendo
      systemd:
        name: docker
        state: started
        enabled: yes